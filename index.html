<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lap Chaser – เกมแข่งรถ</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#244a38;--card:#f4efe2;--cardink:#1d2a24;--hud:rgba(14,20,17,.74);--ink:#f3efe3;--accent:#f2c230;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201a;--card:#1b2420;--cardink:#f3efe3}}
:root[data-theme="dark"]{--bg:#14201a;--card:#1b2420;--cardink:#f3efe3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Kanit,"Noto Sans Thai",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;background:linear-gradient(var(--hud),transparent)}
#hud div{display:flex;flex-direction:column;min-width:0}
#hud small{font-size:12px;opacity:.75}
#hud b{font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
#hud .big{align-items:center}
#hud .big b{font-size:30px;color:var(--accent)}
#spd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 76px);left:12px;font-size:13px;text-shadow:0 1px 3px #000}
#spd b{font-size:22px;font-variant-numeric:tabular-nums}
#rk{display:block;font-size:20px;font-weight:600;color:var(--accent)}
#cd{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:600;color:var(--accent);text-shadow:0 3px 12px #000;pointer-events:none}
.pad{position:fixed;bottom:0;display:flex;gap:12px;padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 14px)}
.pad.l{left:0}.pad.r{right:0}
.pad button{width:78px;height:78px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:var(--hud);color:var(--ink);font:600 18px Kanit,system-ui,sans-serif;touch-action:none}
.pad button.on{background:var(--accent);color:#1d2a24;border-color:var(--accent)}
body:not(.play) #hud,body:not(.play) #spd,body:not(.play) .pad{display:none}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,16,13,.55);padding:20px;box-sizing:border-box}
.card{background:var(--card);color:var(--cardink);border-radius:18px;padding:22px;width:100%;max-width:340px;max-height:100%;overflow:auto;text-align:center;box-sizing:border-box;touch-action:pan-y}
.card h1{margin:0 0 6px;font-size:30px}
.card p{margin:0 0 14px;line-height:1.5;font-size:15px}
.card p.note{font-size:13px;opacity:.8;margin:8px 0 0}
.card input{width:100%;box-sizing:border-box;padding:11px;border-radius:10px;border:2px solid #9aa79f;font:inherit;margin-bottom:10px;text-align:center;background:#fff;color:#1d2a24;user-select:text;-webkit-user-select:text}
.card button{width:100%;font:600 18px Kanit,system-ui,sans-serif;padding:12px;border:0;border-radius:12px;background:#c8402f;color:#fff;margin-bottom:8px}
.card button.alt{background:#2f6fb0}
.card button:disabled{opacity:.45}
.rc{font-size:56px;font-weight:600;letter-spacing:6px;line-height:1.1}
.card ul{list-style:none;padding:0;margin:10px 0 14px;text-align:left}
.card li{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid rgba(128,128,128,.3);font-size:15px}
.card li i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div><small>รอบ</small><b id="lap">1/3</b></div>
  <div class="big"><small>เวลารอบนี้</small><b id="cur">0:00.000</b></div>
  <div><small>รอบเร็วสุด</small><b id="best">–</b></div>
</div>
<div id="spd"><b id="sv">0</b> กม./ชม.<span id="rk"></span></div>
<div id="cd"></div>
<div class="pad l"><button data-k="left">◀</button><button data-k="right">▶</button></div>
<div class="pad r"><button data-k="down">เบรก</button><button data-k="up">เร่ง</button></div>
<div id="ov">
  <div class="card" id="s-menu">
    <h1>Lap Chaser</h1>
    <p>แข่ง 3 รอบ ระวังกำแพงข้างสนาม ชนแล้วเสียความเร็ว</p>
    <input id="nick" maxlength="12" placeholder="ชื่อของคุณ" autocomplete="off">
    <button id="b-solo">เริ่มเล่น</button>
    <button id="b-make" class="alt" disabled>สร้างห้อง</button>
    <button id="b-join" class="alt" disabled>เข้าร่วมห้อง</button>
    <div id="jrow" hidden><input id="code" inputmode="numeric" maxlength="4" placeholder="เลขห้อง 4 หลัก" autocomplete="off"><button id="b-enter">เข้าห้อง</button></div>
    <p id="msg" class="note"></p>
  </div>
  <div class="card" id="s-lobby" hidden>
    <small>เลขห้อง</small>
    <div class="rc" id="rc">0000</div>
    <ul id="pl"></ul>
    <button id="b-start">เริ่มแข่ง</button>
    <p id="wait" class="note">รอเจ้าของห้องเริ่มเกม…</p>
    <button id="b-leave" class="alt">ออกจากห้อง</button>
  </div>
  <div class="card" id="s-res" hidden>
    <h1>เข้าเส้นชัย!</h1>
    <ul id="rl"></ul>
    <button id="b-again">แข่งอีกรอบ</button>
    <p id="rw" class="note">รอเจ้าของห้องเริ่มรอบใหม่…</p>
    <button id="b-exit" class="alt">กลับเมนู</button>
  </div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
let W,H,D;
const rs=()=>{D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D};
addEventListener('resize',rs);rs();

/* ---- track ---- */
const P=[[0,0],[500,-60],[900,-300],[1300,-200],[1450,100],[1150,350],[1250,650],[900,850],[400,750],[100,500],[-250,600],[-550,300],[-500,-100],[-250,-250]];
const cr=(a,b,c,d,t)=>0.5*(2*b+(-a+c)*t+(2*a-5*b+4*c-d)*t*t+(-a+3*b-3*c+d)*t*t*t);
const pts=[];
P.forEach((p1,i)=>{const n=P.length,p0=P[(i+n-1)%n],p2=P[(i+1)%n],p3=P[(i+2)%n];
  for(let s=0;s<20;s++){const t=s/20;pts.push([cr(p0[0],p1[0],p2[0],p3[0],t),cr(p0[1],p1[1],p2[1],p3[1],t)])}});
const N=pts.length,path=new Path2D();
pts.forEach((p,i)=>i?path.lineTo(p[0],p[1]):path.moveTo(p[0],p[1]));path.closePath();
const near=(x,y)=>{let bi=0,bd=1e12,bx=0,by=0;
  for(let i=0;i<N;i++){const a=pts[i],b=pts[(i+1)%N],ex=b[0]-a[0],ey=b[1]-a[1];
    let t=((x-a[0])*ex+(y-a[1])*ey)/(ex*ex+ey*ey);t=t<0?0:t>1?1:t;
    const px=a[0]+ex*t,py=a[1]+ey*t,d=(x-px)*(x-px)+(y-py)*(y-py);
    if(d<bd){bd=d;bi=i;bx=px;by=py}}
  return{i:bi,d:Math.sqrt(bd),px:bx,py:by}};
const grid=s=>{const i=(N-3-3*(s>>1)+N*2)%N,a=pts[i],b=pts[(i+1)%N],g=Math.atan2(b[1]-a[1],b[0]-a[0]),o=(s&1?-1:1)*24;
  return{x:a[0]-Math.sin(g)*o,y:a[1]+Math.cos(g)*o,a:g,v:0}};
const A0=Math.atan2(pts[1][1]-pts[0][1],pts[1][0]-pts[0][0]);

/* ---- state ---- */
const PAL=['#f2c230','#e0583c','#3aa6d9','#7bd65a','#c77bd9','#f08fb0'],TOTAL=3,SR=94,keys={};
let car=grid(0),mode='ready',laps=0,lapStart=0,half=false,prev=0,times=[],best=0,cdStart=0,pr=0,hit=0,DT=.016,myC=0;
let R=null,room=null,net=false,lastRnd=0,rm={},RC=[],nt=0,unP=null,busy=false;
try{best=parseFloat(localStorage.getItem('lc-best'))||0}catch(e){}
const fmt=t=>{const m=Math.floor(t/60),s=t-m*60;return m+':'+s.toFixed(3).padStart(6,'0')};
const nf=v=>typeof v==='number'&&isFinite(v)?v:null;
const ps=()=>room?room.peers().filter(p=>p.kind==='viewer'&&p.presence&&p.presence.n).sort((a,b)=>a.peer<b.peer?-1:1):[];
const nm=p=>String(p.presence.n).slice(0,12);
const isHost=()=>!net||ps().some(p=>p.isMe&&p.presence.host);
const playing=()=>document.body.classList.contains('play');

/* ---- ui helpers ---- */
const show=id=>['s-menu','s-lobby','s-res'].forEach(s=>$(s).hidden=s!==id);
const msg=t=>{$('msg').textContent=t||''};
const row=(c,a,b)=>{const e=document.createElement('li'),s1=document.createElement('span'),s2=document.createElement('span');
  if(c){const d=document.createElement('i');d.style.background=c;s1.append(d)}
  s1.append(a);s2.textContent=b||'';e.append(s1,s2);return e};
const btns=()=>{const h=isHost();$('b-start').hidden=!h;$('wait').hidden=h;$('b-again').hidden=!h;$('rw').hidden=h||!net};
const renderPl=()=>{$('pl').replaceChildren(...ps().map((p,i)=>row(PAL[i%6],nm(p)+(p.isMe?' (คุณ)':'')+(p.presence.host?' ★':''),'')))};
const renderRes=()=>{
  const L=$('rl');
  if(!net){const tot=times.reduce((a,b)=>a+b,0);
    L.replaceChildren(...times.map((t,i)=>row(null,'รอบ '+(i+1),fmt(t))),row(null,'รวม',fmt(tot)));return}
  const a=ps().map(p=>({p,f:nf(p.presence.fin),r:nf(p.presence.pr)||0}));
  a.sort((x,y)=>x.f!=null&&y.f!=null?x.f-y.f:x.f!=null?-1:y.f!=null?1:y.r-x.r);
  L.replaceChildren(...a.map((o,i)=>row(PAL[(nf(o.p.presence.c)||0)%6],(i+1)+'. '+nm(o.p)+(o.p.isMe?' (คุณ)':''),o.f!=null?fmt(o.f):'กำลังแข่ง')))};
const rank=()=>{const o=ps(),me=o.find(p=>p.isMe);if(o.length<2||!me)return'';
  const sc=p=>{const f=nf(p.presence.fin);return f!=null?1000-f:(nf(p.presence.pr)||0)};
  return'อันดับ '+(1+o.filter(p=>sc(p)>sc(me)).length)+'/'+o.length};

/* ---- race flow ---- */
const begin=()=>{
  myC=net?Math.max(0,ps().findIndex(p=>p.isMe)):0;
  car=grid(myC);laps=0;half=false;prev=near(car.x,car.y).i;times=[];pr=0;rm={};
  $('ov').style.display='none';document.body.classList.add('play');mode='count';cdStart=performance.now();
  if(net)room.presence({st:'race',c:myC,fin:null}).catch(()=>{});
};
const finish=()=>{
  mode='done';const tot=times.reduce((a,b)=>a+b,0);
  if(net)room.presence({fin:+tot.toFixed(3),st:'done'}).catch(()=>{});
  document.body.classList.remove('play');$('ov').style.display='flex';show('s-res');renderRes();btns();
};
const send=now=>{
  if(!net||!room||now-nt<60)return;nt=now;
  room.presence({x:Math.round(car.x),y:Math.round(car.y),a:+car.a.toFixed(2),pr:+pr.toFixed(3)}).catch(()=>{});
};
const upd=dt=>{
  RC=[];if(!net||!room)return;const n2={};
  for(const p of room.peers()){
    if(p.isMe||p.kind!=='viewer'||!p.presence)continue;
    const q=p.presence,x=nf(q.x),y=nf(q.y),a=nf(q.a);
    if(x==null||y==null||a==null||q.st==='lobby')continue;
    let r=rm[p.peer]||{x,y,a};const k=Math.min(1,dt*14);
    r={x:r.x+(x-r.x)*k,y:r.y+(y-r.y)*k,a:r.a+Math.atan2(Math.sin(a-r.a),Math.cos(a-r.a))*k};
    n2[p.peer]=r;RC.push({x:r.x,y:r.y,a:r.a,c:PAL[(nf(q.c)||0)%6],n:nm(p)});
  }
  rm=n2;
};
const step=(dt,now)=>{
  if(mode==='count'){
    const s=(now-cdStart)/1000;
    if(s<3)$('cd').textContent=Math.ceil(3-s);
    else{mode='race';lapStart=now;$('cd').textContent='ลุย!';setTimeout(()=>{$('cd').textContent=''},700)}
    return;
  }
  if(mode!=='race')return;
  let nr=near(car.x,car.y);
  const maxV=nr.d>85?170:540;
  if(keys.up)car.v+=360*dt;
  if(keys.down)car.v-=720*dt;
  car.v-=car.v*0.45*dt;
  if(car.v>maxV)car.v=Math.max(maxV,car.v-520*dt);
  if(car.v<0)car.v=0;
  const dir=(keys.right?1:0)-(keys.left?1:0);
  car.a+=dir*2.7*Math.min(1,car.v/110)*(1-0.4*car.v/540)*dt;
  car.x+=Math.cos(car.a)*car.v*dt;car.y+=Math.sin(car.a)*car.v*dt;
  for(const r of RC){const dx=car.x-r.x,dy=car.y-r.y,d=Math.hypot(dx,dy);
    if(d>0&&d<36){const k=(36-d)/2/d;car.x+=dx*k;car.y+=dy*k;car.v*=.985}}
  nr=near(car.x,car.y);
  if(nr.d>SR){ // barrier
    const nx=(car.x-nr.px)/nr.d,ny=(car.y-nr.py)/nr.d;
    car.x=nr.px+nx*SR;car.y=nr.py+ny*SR;
    let vx=Math.cos(car.a)*car.v,vy=Math.sin(car.a)*car.v;const o=vx*nx+vy*ny;
    if(o>0){vx-=nx*o*1.4;vy-=ny*o*1.4;car.v=Math.hypot(vx,vy)*.85;car.a=Math.atan2(vy,vx);hit=.25}
  }
  if(nr.i>N*.4&&nr.i<N*.6)half=true;
  if(prev>N*.85&&nr.i<N*.15&&half){
    const t=(now-lapStart)/1000;times.push(t);
    if(!best||t<best){best=t;try{localStorage.setItem('lc-best',best)}catch(e){}}
    laps++;half=false;lapStart=now;
    if(laps>=TOTAL){prev=nr.i;finish();return}
  }
  prev=nr.i;
  pr=laps+nr.i/N-((!half&&nr.i>N*.9)?1:0);
};

/* ---- drawing ---- */
const carDraw=(x,y,a,c)=>{
  ctx.save();ctx.translate(x,y);ctx.rotate(a);
  ctx.fillStyle='#15191c';[[-17,-15],[-17,10],[11,-15],[11,10]].forEach(w=>ctx.fillRect(w[0],w[1],11,6));
  ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(-24,-10,50,20,7);ctx.fill();
  ctx.fillStyle='#1d2a24';ctx.fillRect(-4,-6,12,12);
  ctx.restore();
};
const draw=now=>{
  ctx.setTransform(D,0,0,D,0,0);
  ctx.fillStyle='#2f6b4f';ctx.fillRect(0,0,W,H);
  const z=Math.min(W,H)/520;
  ctx.translate(W/2,H*0.6);ctx.scale(z,z);ctx.translate(-car.x,-car.y);
  ctx.fillStyle='rgba(255,255,255,.09)';
  const g=130,vw=W/z/2+g,vh=H/z+g;
  for(let gx=Math.floor((car.x-vw)/g)*g;gx<car.x+vw;gx+=g)
    for(let gy=Math.floor((car.y-vh)/g)*g;gy<car.y+vh;gy+=g){ctx.beginPath();ctx.arc(gx,gy,4,0,7);ctx.fill()}
  ctx.lineJoin='round';
  const S=(w,c,d)=>{ctx.setLineDash(d||[]);ctx.lineWidth=w;ctx.strokeStyle=c;ctx.stroke(path)};
  S(208,'#e9e4d6');S(208,'#2f6fb0',[32,32]);   // barrier
  S(188,'#6b6a52');                             // gravel
  S(170,'#ece6d4');S(170,'#c8402f',[28,28]);    // kerb
  S(146,'#3b3f47');S(4,'rgba(255,255,255,.25)',[30,40]);
  ctx.setLineDash([]);
  ctx.save();ctx.translate(pts[0][0],pts[0][1]);ctx.rotate(A0);
  for(let i=0;i<8;i++)for(let j=0;j<2;j++){ctx.fillStyle=(i+j)%2?'#111':'#fff';ctx.fillRect(j*10-10,-72+i*18,10,18)}
  ctx.restore();
  ctx.font='600 15px Kanit,sans-serif';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.fillStyle='#fff';
  for(const r of RC){carDraw(r.x,r.y,r.a,r.c);ctx.strokeText(r.n,r.x,r.y-28);ctx.fillText(r.n,r.x,r.y-28)}
  if(hit>0){ctx.fillStyle='rgba(255,230,150,'+hit*3+')';ctx.beginPath();ctx.arc(car.x,car.y,26,0,7);ctx.fill()}
  carDraw(car.x,car.y,car.a,PAL[myC%6]);
  $('lap').textContent=Math.min(laps+1,TOTAL)+'/'+TOTAL;
  $('cur').textContent=mode==='race'?fmt((now-lapStart)/1000):'0:00.000';
  $('best').textContent=best?fmt(best):'–';
  $('sv').textContent=Math.round(car.v*0.4);
  $('rk').textContent=net?rank():'';
};

/* ---- input ---- */
document.querySelectorAll('.pad button').forEach(b=>{
  const k=b.dataset.k,on=v=>{keys[k]=v;b.classList.toggle('on',v)};
  b.addEventListener('pointerdown',e=>{e.preventDefault();on(1)});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>on(0)));
});
const KM={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',' ':'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};
addEventListener('keydown',e=>{if(playing()&&KM[e.key]){keys[KM[e.key]]=1;e.preventDefault()}});
addEventListener('keyup',e=>{if(KM[e.key])keys[KM[e.key]]=0});
addEventListener('contextmenu',e=>e.preventDefault());

/* ---- websocket adapter: same API shape as a room (join/presence/peers/onPeers/leave) ---- */
const makeNet=()=>({join:name=>new Promise((res,rej)=>{
  let ws;try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host)}catch(e){return rej(e)}
  let me=null,mine={},others=new Map(),subs=new Set(),snap=Object.freeze([]),dirty=false,closed=false;
  const mk=(id,isMe,p)=>Object.freeze({peer:id,by:null,isMe,sameTab:isMe,kind:'viewer',guest:false,presence:p,updatedAt:Date.now()});
  const mark=()=>{
    const a=[];if(me)a.push(mk(me,true,Object.freeze({...mine})));
    others.forEach((p,id)=>a.push(mk(id,false,Object.freeze(p))));
    snap=Object.freeze(a);
    if(!dirty){dirty=true;requestAnimationFrame(()=>{dirty=false;subs.forEach(f=>f({peers:snap}))})}
  };
  const room={name,onLost:null,
    peers:()=>snap,
    presence:p=>{for(const k in p){if(p[k]===null)delete mine[k];else mine[k]=p[k]}
      if(ws.readyState===1)ws.send(JSON.stringify({t:'p',p}));mark();return Promise.resolve()},
    onPeers:f=>{subs.add(f);mark();return()=>subs.delete(f)},
    leave:()=>{closed=true;clearInterval(tm);try{ws.close()}catch(e){}return Promise.resolve()}};
  const tm=setInterval(()=>{if(ws.readyState===1)ws.send('{"t":"ping"}')},20000);
  ws.onopen=()=>ws.send(JSON.stringify({t:'join',room:name}));
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
    if(m.t==='init'){me=m.id;(m.peers||[]).forEach(q=>others.set(q.id,q.p));res(room);mark()}
    else if(m.t==='p'){others.set(m.id,m.p);mark()}
    else if(m.t==='left'){others.delete(m.id);mark()}
    else if(m.t==='full'){closed=true;clearInterval(tm);rej(new Error('full'))}};
  ws.onerror=()=>{if(!me)rej(new Error('ws'))};
  ws.onclose=()=>{clearInterval(tm);if(closed)return;closed=true;
    if(me){others.clear();mark();if(room.onLost)room.onLost()}else rej(new Error('closed'))};
  setTimeout(()=>{if(!me){closed=true;clearInterval(tm);try{ws.close()}catch(e){}rej(new Error('timeout'))}},10000);
})});

/* ---- online rooms ---- */
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const onP=()=>{
  const o=ps(),hs=o.filter(p=>p.presence.host);
  if(!hs.length&&o.length&&o[0].isMe)room.presence({host:true,rnd:lastRnd}).catch(()=>{});
  hs.sort((a,b)=>(nf(b.presence.rnd)||0)-(nf(a.presence.rnd)||0));
  if(hs[0]){const r=nf(hs[0].presence.rnd)||0;if(r>lastRnd){lastRnd=r;begin();return}}
  if(playing())return;
  if(!$('s-lobby').hidden){renderPl();btns()}
  if(!$('s-res').hidden){renderRes();btns()}
};
const nick=()=>$('nick').value.trim().slice(0,12)||'นักแข่ง'+(100+Math.floor(Math.random()*900));
const enter=async(cd,make)=>{
  if(busy||!R)return;busy=true;msg('กำลังเชื่อมต่อ…');
  try{
    const me=nick();
    for(let k=0;k<4;k++){
      if(make)cd=String(1000+Math.floor(Math.random()*9000));
      room=await R.join('lc'+cd);
      await room.presence({n:me,st:'lobby'});
      await wait(make?1200:2600);
      const o=ps().filter(p=>!p.isMe),hasHost=o.some(p=>p.presence.host);
      if(make){
        if(hasHost){await room.leave();room=null;continue}
        await room.presence({host:true,rnd:0});break;
      }
      if(!hasHost||o.length>=6){await room.leave();room=null;msg(hasHost?'ห้องเต็มแล้ว':'ไม่พบห้องนี้');return}
      break;
    }
    if(!room){msg('สร้างห้องไม่สำเร็จ ลองอีกครั้ง');return}
    net=true;const h=ps().find(p=>p.presence.host);lastRnd=h?nf(h.presence.rnd)||0:0;
    unP=room.onPeers(onP);room.onLost=()=>leave().then(()=>msg('หลุดการเชื่อมต่อ'));
    $('rc').textContent=cd;show('s-lobby');renderPl();btns();msg('');
  }catch(e){room=null;msg('เชื่อมต่อไม่ได้ ลองอีกครั้ง')}
  finally{busy=false}
};
const leave=async()=>{
  if(unP)unP();unP=null;const r=room;room=null;net=false;RC=[];
  try{if(r)await r.leave()}catch(e){}
  mode='ready';car=grid(0);document.body.classList.remove('play');$('ov').style.display='flex';show('s-menu');msg('');
};
$('b-solo').onclick=()=>{net=false;begin()};
$('b-make').onclick=()=>enter('',1);
$('b-join').onclick=()=>{$('jrow').hidden=false;$('code').focus()};
$('b-enter').onclick=()=>{const c=$('code').value.replace(/\D/g,'');if(c.length!==4)return msg('ใส่เลขห้อง 4 หลัก');enter(c,0)};
$('b-start').onclick=()=>{if(room)room.presence({rnd:lastRnd+1}).catch(()=>{})};
$('b-again').onclick=()=>{if(net){if(room)room.presence({rnd:lastRnd+1}).catch(()=>{})}else begin()};
$('b-leave').onclick=leave;$('b-exit').onclick=leave;
R=/^https?:/.test(location.protocol)?makeNet():null;
if(R){$('b-make').disabled=$('b-join').disabled=false}
else msg('ห้องออนไลน์ใช้ได้เมื่อเปิดผ่านเว็บที่อัปขึ้นเซิร์ฟเวอร์แล้วเท่านั้น');

let last=performance.now();
const loop=now=>{
  DT=Math.min(.05,(now-last)/1000);last=now;hit=Math.max(0,hit-DT);
  upd(DT);step(DT,now);draw(now);
  if(mode!=='ready')send(now);
  requestAnimationFrame(loop);
};
requestAnimationFrame(loop);
})();
</script>
